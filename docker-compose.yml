version: '3.8'

networks:
  devsecops-net:
    driver: bridge

volumes:
  jenkins_home:
  sonarqube_data:
  sonar_db_data:
  prometheus_data:
  grafana_data:

services:
  # -----------------------------------------------
  # 1. CI/CD ENGINE & SECURITY SCANNERS
  # -----------------------------------------------
  jenkins:
    image: jenkins/jenkins:lts
    container_name: devsecops-jenkins
    user: root
    ports:
      - "8080:8080"
    environment:
    - "JAVA_OPTS=-Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true"
    volumes:
      - /var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      # Quote local paths containing spaces and special characters (+)
      - "/home/brijesh/Documents/DevSecOps + Monitoring:/var/jenkins_home/DevSecOps"
    networks:
      - devsecops-net

  sonar-db:
    image: postgres:15-alpine
    container_name: devsecops-sonar-db
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar_pass
      - POSTGRES_DB=sonarqube
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    networks:
      - devsecops-net

  sonarqube:
    image: sonarqube:lts-community
    container_name: devsecops-sonarqube
    depends_on:
      - sonar-db
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar_pass
      - SONAR_JDBC_URL=jdbc:postgresql://sonar-db:5432/sonarqube
    volumes:
      - sonarqube_data:/opt/sonarqube/data
    networks:
      - devsecops-net

  # -----------------------------------------------
  # 2. MONITORING & OBSERVABILITY STACK
  # -----------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: devsecops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - devsecops-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: devsecops-cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/lib/containerd/:/var/lib/containerd:ro
      - /dev/disk/:/dev/disk:ro
      - /etc/machine-id:/etc/machine-id:ro
    command:
      - --docker_only=true
      - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,process,referenced_memory,resctrl,sched,tcp,udp
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,environment,app_name
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - devsecops-net

  grafana:
    image: grafana/grafana:latest
    container_name: devsecops-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - devsecops-net